name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore NESTracer/NESTracer.csproj

      - name: Build
        run: dotnet build NESTracer/NESTracer.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish NESTracer/NESTracer.csproj --configuration Release --no-build --output artifacts/NESTracer

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NESTracer-Windows-Release
          path: artifacts/NESTracer
